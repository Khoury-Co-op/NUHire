version: '3.8'

services:
  db:
    image: mysql:latest
    container_name: panployer-mysql
    platform: linux/amd64
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT}:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      # db_data not persisted for dev
      # - db_data:/var/lib/mysql
      - ./database-files:/docker-entrypoint-initdb.d:ro

  api:
    platform: linux/amd64
    # Repo root, so the image can include database-files/migrations, which the
    # API runs at startup. See the header of api/dockerfile.
    build:
      context: .
      dockerfile: api/dockerfile
    container_name: api_container
    # on-failure:5 meant the fifth crash in a class ended the class.
    restart: unless-stopped
    ports:
      - '${API_PORT}:5001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: frontend_container
    ports:
      - '${FRONTEND_PORT}:3000'
    depends_on:
      - api

volumes:
  # db_data not persisted for dev
  # db_data:
  apicode:
