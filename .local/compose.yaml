# MySQL and Keycloak, extended by the root compose.dev.yaml. On its own: `npm run dev:services`.
name: nuhire-local

services:
  db:
    image: mysql:8.4
    container_name: nuhire-mysql
    restart: unless-stopped
    # Let mysqld finish shutting down; Docker may otherwise force-kill it after 1s.
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: nuhire
      MYSQL_DATABASE: nuhire
    ports:
      - '127.0.0.1:3307:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -pnuhire']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql
      - ../database-files/Pandployer.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: nuhire-keycloak
    restart: unless-stopped
    command: ['start-dev', '--import-realm', '--http-port=8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
    # No curl in the image, so bash /dev/tcp against the management port.
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    # No volume for keycloak's h2 db on purpose: the named volume is root-owned
    # and keycloak runs as uid 1000. The realm re-imports from the file on every
    # boot, so test users survive; admin-console tweaks do not.

volumes:
  db_data:
